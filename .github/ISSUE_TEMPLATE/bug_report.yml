name: Bug report
description: Something on the site is broken or looks wrong.
title: "fix: "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or page name, and the language (HR / EN).
      placeholder: /usluge (HR)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: iPhone 15, Safari 18 · Windows 11, Chrome 141
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here.
