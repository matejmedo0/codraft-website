name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # No usage data leaves CI.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 is the production version, from .nvmrc. 26 is the next LTS (from
        # 2026-10-28) and runs only on the way to main; dev gets the basic run.
        node: ${{ fromJSON((github.base_ref == 'main' || github.ref == 'refs/heads/main') && '["24", "26"]' || '["24"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node != '24' && matrix.node || '' }}
          node-version-file: ${{ matrix.node == '24' && '.nvmrc' || '' }}
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: JavaScript budget
        run: npm run check:budget
      - name: Copy guardrails
        run: npm run check:guardrails

  e2e:
    name: E2E (Chromium)
    # Full suite only on the way to main; dev gets the basic run.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: E2E tests
        run: npm run test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
